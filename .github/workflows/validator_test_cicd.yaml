name: "Validator Tests"

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/validator/**'
      - '.github/workflows/validator_test_cicd.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/validator/**'
      - '.github/workflows/validator_test_cicd.yaml'

jobs:
  validator-unit-tests:
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Install validator dependencies
        run: python -m pip install -r .github/workflows/validator/requirements.txt

      - name: Run validator unit tests
        run: python .github/workflows/validator/tests/run_tests.py
